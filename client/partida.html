<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partida — Roubopolis</title>

  <link rel="preload" href="/assets/fontes/VCRosdNEUE.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/assets/tabuleiro/cidade.webp" as="image">

  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/variaveis.css">
  <link rel="stylesheet" href="/css/base/tipografia.css">
  <!-- Só pelo aviso passageiro (toast), que mora lá. -->
  <link rel="stylesheet" href="/css/componentes/modal.css">
  <link rel="stylesheet" href="/css/componentes/tabuleiro.css">
  <link rel="stylesheet" href="/css/componentes/dados.css">
  <link rel="stylesheet" href="/css/componentes/sorteio.css">
  <link rel="stylesheet" href="/css/telas/partida.css">
</head>

<body class="tela-partida">

  <div class="fundo-partida" aria-hidden="true"></div>

  <main class="partida">

    <img class="partida__logo" src="/assets/logo/roubodopolis.png" alt="Roubopolis">

    <!-- O lema pichado da arte, embaixo do primeiro jogador. -->
    <p class="lema" aria-hidden="true">
      <span>Investir</span><span>Negociar</span><span>Construir</span><span>Dominar</span>
      <span class="lema__coroa" data-icone="coroa"></span>
    </p>

    <!-- Um cartão em cada canto da tela, na ordem de jogada. -->
    <ol class="jogadores" id="jogadores" aria-label="Jogadores"></ol>

    <section class="mesa" aria-label="Tabuleiro">
      <div class="tabuleiro" id="tabuleiro">
        <svg class="tabuleiro__svg" id="tabuleiro-svg" role="img" aria-label="Tabuleiro de Roubopolis"></svg>
        <!-- Os dados ficam no canto de baixo do tabuleiro, como na arte. -->
        <div class="dados" id="dados">
          <div class="dados__soma" id="dados-soma" aria-live="polite"></div>
          <div class="dado" id="dado-a"><div class="dado__cubo" id="cubo-a"></div></div>
          <div class="dado" id="dado-b"><div class="dado__cubo" id="cubo-b"></div></div>
        </div>
        <div class="peoes" id="peoes"></div>
      </div>
    </section>

    <aside class="legenda moldura" aria-labelledby="legenda-titulo">
      <h2 class="legenda__titulo" id="legenda-titulo">Legenda</h2>
      <ul class="legenda__itens" id="legenda"></ul>
    </aside>

    <!-- O mesmo chat do lobby: a conversa da sala continua na partida. -->
    <section class="chat-jogo moldura" id="chat" aria-labelledby="chat-titulo" hidden>
      <header class="chat-jogo__topo">
        <h2 class="chat-jogo__titulo" id="chat-titulo">Chat da sala</h2>
        <span class="chat-jogo__status" id="chat-status" role="status">Conectando...</span>
        <button class="chat-jogo__fechar" type="button" id="chat-fechar" aria-label="Fechar o chat">×</button>
      </header>
      <ol class="chat-jogo__mensagens" id="chat-mensagens" aria-live="polite"></ol>
      <form class="chat-jogo__formulario" id="chat-formulario">
        <label class="visualmente-oculto" for="chat-texto">Mensagem</label>
        <input id="chat-texto" name="texto" maxlength="280" autocomplete="off" placeholder="Escreva para a mesa...">
        <button class="chat-jogo__enviar" type="submit">Enviar</button>
      </form>
    </section>

    <nav class="acoes" aria-label="Opções">
      <button class="acao moldura" type="button" id="chat-abrir" aria-controls="chat" aria-expanded="false">
        <span data-icone="balao"></span>Chat<span class="acao__contador" id="chat-contador" hidden></span>
      </button>
      <button class="acao moldura" type="button" id="regras"><span data-icone="regras"></span>Regras</button>
      <button class="acao moldura" type="button" id="ranking"><span data-icone="trofeu"></span>Ranking</button>
      <button class="acao moldura" type="button" id="config"><span data-icone="engrenagem"></span>Config.</button>
      <button class="acao moldura" type="button" id="sair"><span data-icone="sair"></span>Sair</button>
    </nav>

    <div class="jogar">
      <span class="jogar__seta jogar__seta--esquerda" data-icone="chevron" aria-hidden="true"></span>
      <button class="jogar__botao moldura" type="button" id="jogar" disabled>Jogar</button>
      <span class="jogar__seta" data-icone="chevron" aria-hidden="true"></span>
      <p class="jogar__aviso" id="aviso" role="status"></p>
    </div>

  </main>

  <!-- Anúncio da vez, atravessa a tela na troca de turno -->
  <div class="anuncio" id="anuncio" aria-hidden="true"><span id="anuncio-texto"></span></div>

  <!-- Abertura: todo mundo junto jogando os dados para ver quem começa -->
  <div class="cortina" id="modal-ordem" hidden>
    <div class="sorteio moldura" role="dialog" aria-modal="true" aria-labelledby="ordem-titulo">
      <h2 class="sorteio__titulo" id="ordem-titulo">Quem começa</h2>
      <p class="sorteio__explica">Todo mundo joga junto. Quem tirar mais, começa.</p>
      <div class="sorteio__mesa" id="sorteio-mesa"></div>
      <div class="sorteio__acoes">
        <button class="jogar__botao jogar__botao--pequeno moldura" type="button" id="ordem-fechar" disabled>
          Bora jogar
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/telas/partida.js"></script>
</body>
</html>
