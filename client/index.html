<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roubodopolis</title>

  <link rel="preload" href="/assets/fontes/VCRosdNEUE.ttf" as="font" type="font/ttf" crossorigin>

  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/variaveis.css">
  <link rel="stylesheet" href="/css/base/tipografia.css">
  <link rel="stylesheet" href="/css/componentes/cenario.css">
  <link rel="stylesheet" href="/css/componentes/botao.css">
  <link rel="stylesheet" href="/css/componentes/modal.css">
  <link rel="stylesheet" href="/css/telas/menu.css">
</head>

<body class="tema-verde">

  <div class="cenario cenario--verde" aria-hidden="true">
    <div class="cenario__scanlines"></div>
  </div>

  <!-- Antes do conteúdo no DOM: assim ficam por baixo do menu. -->
  <img class="enfeite enfeite--dinheiro-a enfeite--flutua" src="/assets/objetos/dinheiro.png" alt="" aria-hidden="true">
  <img class="enfeite enfeite--dinheiro-b enfeite--flutua" src="/assets/objetos/dinheiro.png" alt="" aria-hidden="true">
  <img class="enfeite enfeite--dinheiro-c enfeite--flutua" src="/assets/objetos/dinheiro.png" alt="" aria-hidden="true">
  <img class="enfeite enfeite--colar" src="/assets/objetos/colar.png" alt="" aria-hidden="true">
  <img class="enfeite enfeite--detetive" src="/assets/objetos/detetive.png" alt="" aria-hidden="true">

  <main class="tela">
    <div class="menu">

      <header class="marquise">
        <img class="marquise__oculos" src="/assets/objetos/oculos.png" alt="" aria-hidden="true">
        <img class="marquise__figura marquise__figura--esq" src="/assets/objetos/policial.png" alt="" aria-hidden="true">
        <img class="marquise__logo" src="/assets/logo/roubodopolis.png" alt="Roubodopolis">
        <img class="marquise__figura marquise__figura--dir" src="/assets/objetos/mulher.png" alt="" aria-hidden="true">
      </header>

      <section class="menu__identidade">
        <label class="rotulo" for="nome">Seu nome</label>
        <input
          class="campo campo--placa"
          id="nome"
          type="text"
          maxlength="16"
          autocomplete="nickname"
          spellcheck="false"
          placeholder="digite aqui"
          aria-describedby="dica">
        <p class="menu__dica" id="dica" role="status"></p>
      </section>

      <nav class="menu__opcoes" id="opcoes" aria-label="Menu principal">
        <button class="opcao" type="button" data-acao="jogar">
          <img src="/assets/menu/jogar.png" alt="Jogar">
        </button>
        <button class="opcao opcao--texto" type="button" data-acao="abrir-codigo">
          Entrar com código
        </button>
        <button class="opcao opcao--dormindo" type="button" data-acao="amigos">
          <img src="/assets/menu/amigos.png" alt="Amigos">
        </button>
        <button class="opcao opcao--dormindo" type="button" data-acao="loja">
          <img src="/assets/menu/loja.png" alt="Loja">
        </button>
        <button class="opcao" type="button" data-acao="config">
          <img src="/assets/menu/configuracao.png" alt="Configuração">
        </button>
        <button class="opcao" type="button" data-acao="sair">
          <img src="/assets/menu/sair.png" alt="Sair">
        </button>
      </nav>

    </div>
    <p class="menu__rodape">v0.1 - nome e lobby</p>
  </main>

  <!-- Entrar numa sala de amigo -->
  <div class="painel" id="painel-codigo" hidden>
    <div class="painel__caixa" role="dialog" aria-modal="true" aria-labelledby="titulo-codigo">
      <h2 class="painel__titulo" id="titulo-codigo">Entrar com código</h2>
      <input
        class="campo"
        id="codigo"
        type="text"
        maxlength="8"
        spellcheck="false"
        placeholder="ABC123"
        aria-label="Código da sala">
      <div class="painel__acoes">
        <button class="botao botao--pequeno" type="button" data-acao="entrar-codigo">Entrar</button>
        <button class="botao botao--pequeno botao--roxo" type="button" data-acao="fechar">Voltar</button>
      </div>
    </div>
  </div>

  <!-- Configuração -->
  <div class="painel" id="painel-config" hidden>
    <div class="painel__caixa" role="dialog" aria-modal="true" aria-labelledby="titulo-config">
      <h2 class="painel__titulo" id="titulo-config">Configuração</h2>

      <div class="painel__linha">
        <span>Som</span>
        <button class="interruptor" type="button" id="som" aria-pressed="true">Ligado</button>
      </div>
      <div class="painel__linha">
        <span>Meus dados neste navegador</span>
        <button class="interruptor" type="button" id="esquecer">Apagar</button>
      </div>

      <p class="texto-miudo" style="margin-top:var(--e3);opacity:.6">
        Você não tem senha: seu nome fica salvo só neste navegador.
      </p>

      <div class="painel__acoes">
        <button class="botao botao--pequeno botao--roxo" type="button" data-acao="fechar">Voltar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/telas/menu.js"></script>
</body>
</html>
