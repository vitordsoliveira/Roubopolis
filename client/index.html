<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roubopolis</title>

  <link rel="preload" href="/assets/fontes/VCRosdNEUE.ttf" as="font" type="font/ttf" crossorigin>

  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/variaveis.css">
  <link rel="stylesheet" href="/css/base/tipografia.css">
  <link rel="stylesheet" href="/css/componentes/cenario.css">
  <link rel="stylesheet" href="/css/componentes/botao.css">
  <link rel="stylesheet" href="/css/componentes/modal.css">
  <link rel="stylesheet" href="/css/telas/menu.css">
</head>

<body class="tema-verde">

  <div class="cenario cenario--verde" aria-hidden="true">
    <div class="cenario__scanlines"></div>
  </div>

  <!-- Antes do conteúdo no DOM: assim ficam por baixo do menu. -->
  <img class="enfeite enfeite--dinheiro-a enfeite--flutua" src="/assets/objetos/dinheiro.png" alt="" aria-hidden="true">
  <img class="enfeite enfeite--dinheiro-b enfeite--flutua" src="/assets/objetos/dinheiro.png" alt="" aria-hidden="true">
  <img class="enfeite enfeite--dinheiro-c enfeite--flutua" src="/assets/objetos/dinheiro.png" alt="" aria-hidden="true">
  <img class="enfeite enfeite--colar" src="/assets/objetos/colar.png" alt="" aria-hidden="true">
  <img class="enfeite enfeite--detetive" src="/assets/objetos/detetive.png" alt="" aria-hidden="true">

  <main class="tela">
    <div class="menu">

      <header class="marquise">
        <img class="marquise__oculos" src="/assets/objetos/oculos.png" alt="" aria-hidden="true">
        <img class="marquise__figura marquise__figura--esq" src="/assets/objetos/policial.png" alt="" aria-hidden="true">
        <img class="marquise__logo" src="/assets/logo/roubodopolis.png" alt="Roubodopolis">
        <img class="marquise__figura marquise__figura--dir" src="/assets/objetos/mulher.png" alt="" aria-hidden="true">
      </header>

      <section class="menu__login" aria-labelledby="titulo-login">
        <h1 class="neon" id="titulo-login">ENTRE NA CIDADE</h1>
        <div class="login__abas" role="tablist" aria-label="Acesso">
          <button class="login__aba login__aba--ativa" type="button" data-modo="entrar" role="tab" aria-selected="true">Entrar</button>
          <button class="login__aba" type="button" data-modo="cadastrar" role="tab" aria-selected="false">Criar conta</button>
        </div>
        <label class="rotulo" for="login">Nome de usuário</label>
        <input class="campo campo--placa" id="login" type="text" maxlength="32" autocomplete="username" spellcheck="false" placeholder="seu usuário">
        <label class="rotulo" for="senha">Senha</label>
        <input class="campo campo--placa" id="senha" type="password" maxlength="128" autocomplete="current-password" placeholder="sua senha">
        <div class="login__nome" id="bloco-nome" hidden>
          <label class="rotulo" for="nome">Nome no jogo</label>
          <input class="campo campo--placa" id="nome" type="text" maxlength="16" autocomplete="nickname" spellcheck="false" placeholder="como vão te chamar?">
        </div>
        <button class="botao login__botao" type="button" id="acessar">Entrar</button>
        <p class="menu__dica" id="dica" role="alert"></p>
      </section>

      <nav class="menu__opcoes" id="opcoes" aria-label="Menu principal" hidden>
        <button class="opcao" type="button" data-acao="jogar">
          <img src="/assets/menu/jogar.png" alt="Jogar">
        </button>
        <button class="opcao opcao--texto" type="button" data-acao="abrir-codigo">
          Entrar com código
        </button>
        <button class="opcao opcao--dormindo" type="button" data-acao="amigos">
          <img src="/assets/menu/amigos.png" alt="Amigos">
        </button>
        <button class="opcao opcao--dormindo" type="button" data-acao="loja">
          <img src="/assets/menu/loja.png" alt="Loja">
        </button>
        <button class="opcao" type="button" data-acao="config">
          <img src="/assets/menu/configuracao.png" alt="Configuração">
        </button>
        <button class="opcao" type="button" data-acao="sair">
          <img src="/assets/menu/sair.png" alt="Sair">
        </button>
      </nav>

    </div>
    <p class="menu__rodape">
      <span id="rodape-mensagem">v0.1 - nome e lobby</span>
      <button class="menu__rodape-nome" id="atalho-perfil" type="button" data-acao="perfil" hidden></button>
      <span id="rodape-final" hidden>!</span>
    </p>
  </main>

  <!-- Entrar numa sala de amigo -->
  <div class="painel" id="painel-codigo" hidden>
    <div class="painel__caixa" role="dialog" aria-modal="true" aria-labelledby="titulo-codigo">
      <h2 class="painel__titulo" id="titulo-codigo">Entrar com código</h2>
      <input
        class="campo"
        id="codigo"
        type="text"
        maxlength="8"
        spellcheck="false"
        placeholder="ABC123"
        aria-label="Código da sala">
      <div class="painel__acoes">
        <button class="botao botao--pequeno" type="button" data-acao="entrar-codigo">Entrar</button>
        <button class="botao botao--pequeno botao--roxo" type="button" data-acao="fechar">Voltar</button>
      </div>
    </div>
  </div>

  <!-- Configuração -->
  <div class="painel" id="painel-config" hidden>
    <div class="painel__caixa" role="dialog" aria-modal="true" aria-labelledby="titulo-config">
      <h2 class="painel__titulo" id="titulo-config">Configuração</h2>

      <div class="painel__linha">
        <span>Som</span>
        <button class="interruptor" type="button" id="som" aria-pressed="true">Ligado</button>
      </div>
      <div class="painel__linha">
        <span>Exibição</span>
        <select class="seletor-exibicao" id="modo-exibicao" aria-label="Modo de exibição">
          <option value="janela">Modo janela</option>
          <option value="tela-cheia">Tela cheia</option>
        </select>
      </div>
      <label class="painel__linha controle-volume" for="volume-som">
        <span>Volume dos efeitos</span>
        <span class="controle-volume__valor" id="valor-volume-som">100%</span>
        <input id="volume-som" type="range" min="0" max="100" step="5" value="100">
      </label>
      <div class="painel__acoes">
        <button class="botao botao--pequeno botao--roxo" type="button" data-acao="fechar">Voltar</button>
      </div>
    </div>
  </div>

  <!-- Perfil -->
  <div class="painel" id="painel-perfil" hidden>
    <div class="painel__caixa" role="dialog" aria-modal="true" aria-labelledby="titulo-perfil">
      <h2 class="painel__titulo" id="titulo-perfil">Meu perfil</h2>
      <p class="perfil__nome" id="perfil-nome"></p>
      <div class="perfil__estatisticas" aria-label="Estatísticas da conta">
        <div class="perfil__estatistica">
          <strong id="perfil-partidas">0</strong>
          <span>Partidas</span>
        </div>
        <div class="perfil__estatistica">
          <strong id="perfil-vitorias">0</strong>
          <span>Vitórias</span>
        </div>
        <div class="perfil__estatistica">
          <strong id="perfil-derrotas">0</strong>
          <span>Derrotas</span>
        </div>
      </div>
      <p class="perfil__aviso" id="perfil-aviso" hidden></p>
      <div class="painel__acoes">
        <button class="botao botao--pequeno botao--roxo" type="button" data-acao="fechar">Voltar</button>
      </div>
    </div>
  </div>

  <!-- Saída -->
  <div class="painel" id="painel-saida" hidden>
    <div class="painel__caixa" role="dialog" aria-modal="true" aria-labelledby="titulo-saida">
      <h2 class="painel__titulo" id="titulo-saida">Sair</h2>
      <p class="saida__pergunta">O que você deseja fazer?</p>
      <div class="painel__acoes saida__acoes">
        <button class="botao botao--pequeno" type="button" data-acao="logout">Logout</button>
        <button class="botao botao--pequeno botao--perigo" type="button" data-acao="sair-jogo">Sair do jogo</button>
        <button class="botao botao--pequeno botao--verde" type="button" data-acao="fechar">Voltar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/telas/menu.js"></script>
</body>
</html>
