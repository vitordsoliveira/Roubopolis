<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby — Roubodopolis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/variaveis.css">
  <link rel="stylesheet" href="/css/base/tipografia.css">
  <link rel="stylesheet" href="/css/componentes/cenario.css">
  <link rel="stylesheet" href="/css/componentes/botao.css">
  <link rel="stylesheet" href="/css/componentes/modal.css">
  <link rel="stylesheet" href="/css/componentes/boneco.css">
  <link rel="stylesheet" href="/css/telas/lobby.css">
</head>

<body class="tema-laranja">

  <div class="cenario" aria-hidden="true">
    <div class="cenario__cidade cenario__cidade--fundo"></div>
    <div class="cenario__cidade"></div>
    <span class="nuvem nuvem--a"></span>
    <span class="nuvem nuvem--c"></span>
    <div class="cenario__scanlines"></div>
  </div>

  <main class="tela">
    <div class="lobby">

      <header class="lobby__topo">
        <button class="botao botao--pequeno" type="button" id="voltar">Voltar</button>
        <h1 class="logo logo--pequeno neon">ROUBODOPOLIS</h1>
        <div class="lobby__codigo">
          <span class="rotulo">Sala</span>
          <strong id="codigo-sala">······</strong>
          <button class="botao botao--pequeno botao--roxo" type="button" id="copiar">Copiar</button>
        </div>
      </header>

      <div class="lobby__corpo">

        <section>
          <h2 class="titulo-secao">Escolha seu personagem</h2>
          <!-- Os quatro bonecos entram aqui; cada um só pode ser de uma pessoa. -->
          <div class="personagens" id="personagens"></div>
        </section>

        <aside class="mesa">
          <h2 class="mesa__titulo">Na mesa</h2>
          <ul class="mesa__lista" id="mesa"></ul>
        </aside>

      </div>

      <footer class="lobby__acoes">
        <button class="botao botao--verde" type="button" id="pronto" disabled>Estou pronto</button>
        <button class="botao" type="button" id="iniciar" disabled hidden
                title="O tabuleiro entra na próxima fase do projeto">Iniciar partida</button>
        <p class="lobby__aviso" id="aviso" role="status"></p>
      </footer>

    </div>
  </main>

  <script type="module" src="/js/telas/lobby.js"></script>
</body>
</html>
